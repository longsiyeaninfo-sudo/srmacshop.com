    <path d="M-2.6,-21.4 c2.7,-3.3 4.5,-7.8 4,-12.4 c-3.9,0.2 -8.6,2.5 -11.4,5.8 c-2.5,3 -4.7,7.6 -4.1,12 c4.4,0.3 8.8,-2.2 11.5,-5.4 z M9.6,-15.1 c-6.4,-0.4 -11.8,3.6 -14.8,3.6 c-3,0 -7.7,-3.4 -12.7,-3.4 c-6.5,0.1 -12.7,3.8 -16.1,9.7 c-6.9,11.9 -1.8,29.6 4.9,39.3 c3.3,4.7 7.2,10.1 12.3,9.9 c4.9,-0.2 6.8,-3.2 12.7,-3.2 c5.9,0 7.6,3.2 12.7,3.1 c5.3,-0.1 8.7,-4.8 11.9,-9.6 c3.8,-5.5 5.3,-10.8 5.4,-11.1 c-0.1,-0.1 -10.4,-4 -10.5,-15.8 c-0.1,-9.9 8.1,-14.6 8.4,-14.8 c-4.6,-6.8 -11.8,-7.5 -14.2,-7.7 z" fill="#fff"/>
  </g>

