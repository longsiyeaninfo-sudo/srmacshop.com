<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="SR MAC SHOP — Apple Hardware & Care">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a8a8e"/>
      <stop offset="100%" stop-color="#6e6e73"/>
    </linearGradient>
    <!-- Path for top curved text -->
    <path id="topCurve" d="M 30,100 A 70,70 0 0 1 170,100" fill="none"/>
    <!-- Path for bottom curved text -->
    <path id="bottomCurve" d="M 30,100 A 70,70 0 0 0 170,100" fill="none"/>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="100" fill="url(#bbg)"/>
  <circle cx="100" cy="100" r="97" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/>

  <!-- Curved top text: SR MAC SHOP -->
  <text fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
        font-size="17" font-weight="800" letter-spacing="2">
    <textPath href="#topCurve" startOffset="50%" text-anchor="middle">SR MAC SHOP</textPath>
  </text>

  <!-- Decorative dashes flanking the curved text -->
  <text x="100" y="78" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="10" letter-spacing="6">— APPLE HARDWARE &amp; CARE —</text>

  <!-- Apple silhouette -->
  <g transform="translate(100 110)">
    <path d="M-3.3,-27 c3.5,-4.2 5.7,-9.9 5.1,-15.7 c-5,0.3 -11,3.2 -14.5,7.4 c-3.1,3.7 -6,9.7 -5.2,15.2 c5.6,0.4 11.2,-2.8 14.6,-6.9 z M12.2,-19.1 c-8.1,-0.5 -15,4.6 -18.8,4.6 c-3.8,0 -9.8,-4.3 -16.1,-4.3 c-8.3,0.1 -16.2,4.8 -20.5,12.3 c-8.7,15.1 -2.3,37.7 6.2,49.9 c4.2,6 9.2,12.8 15.7,12.6 c6.2,-0.2 8.6,-4 16.1,-4 c7.5,0 9.7,4 16.1,4 c6.7,-0.1 11,-6 15.2,-12.2 c4.8,-7 6.7,-13.7 6.8,-14.1 c-0.2,-0.1 -13.2,-5.1 -13.4,-20.1 c-0.2,-12.6 10.3,-18.6 10.7,-18.8 c-5.9,-8.6 -15,-9.5 -18,-9.8 z" fill="#fff"/>
  </g>

  <!-- SR letters inside the apple -->
  <text x="100" y="120" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial Black, sans-serif"
        font-size="28" font-weight="900" letter-spacing="-1"
        fill="#1d1d1f">SR</text>

  <!-- Curved bottom text: GENUINE PARTS -->
  <text fill="rgba(255,255,255,.85)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
        font-size="13" font-weight="700" letter-spacing="3">
    <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">APPLE HARDWARE &amp; CARE  ·  GENUINE PARTS</textPath>
  </text>
</svg>
